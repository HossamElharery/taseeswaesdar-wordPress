; PHP Configuration for Bizgen Theme
; Based on requirements from https://docs.reactheme.com/docs/bizgen-business-wordpress-theme/requirements/

memory_limit = 256M
max_execution_time = 300
post_max_size = 256M
upload_max_filesize = 500M
max_input_time = 300
max_input_vars = 3000

; Additional recommended settings
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On

; File upload settings
file_uploads = On

; Session settings
session.gc_maxlifetime = 1440

